name: Bot di trading (controllo giornaliero)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie necessarie
        run: pip install -r requirements.txt

      - name: Esegui il bot (un solo ciclo)
        env:
          PROVIDER: ${{ secrets.PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODALITA_TEST: ${{ secrets.MODALITA_TEST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python esegui_una_volta.py

      - name: Salva il portafoglio virtuale, il log e lo storico aggiornati
        run: |
          git config user.name "bot-automatico"
          git config user.email "bot-automatico@users.noreply.github.com"
          git add portafoglio_virtuale.json log.txt STORICO.md dashboard.png || true
          git diff --staged --quiet || git commit -m "Aggiornamento automatico del bot"
          git push
